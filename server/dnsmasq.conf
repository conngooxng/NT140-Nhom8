# dnsmasq configuration for the VPN lab.

port=53
bind-interfaces
interface=wlan0
except-interface=lo
no-resolv
no-hosts
local-ttl=60

dhcp-authoritative
dhcp-range=10.42.0.100,10.42.0.199,255.255.255.0,4h

dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.2
dhcp-option=option:domain-name,lab.test

address=/http.lab.test/10.42.0.1
address=/secure.lab.test/10.42.0.1
address=/shop.lab.test/10.42.0.1
address=/ads.lab.test/10.42.0.1
address=/tracker.lab.test/10.42.0.1

address=/partner.lab.test/10.42.0.99
host-record=ipv6.lab.test,fd42:42::1

dhcp-leasefile=/tmp/vpn-lab/vpn-lab-dnsmasq.leases

log-queries
log-facility=/tmp/vpn-lab/vpn-lab-dnsmasq.log
